    # 修改记录：2026-08-25 | DingJiaye
    # 以下为持续核验方向；已核验基准事件另列于 verified_events，二者不得混同。
    monitoring_focus:
      - MBK Partners 对 Godiva Japan／Orchid 的持股处置、潜在买方、交易估值及融资安排
      - Godiva Japan 银团贷款的到期、展期条件、担保安排及新增融资披露
      - 主要融资银行、管理层、门店网络、生产物流及核心供应链的异常变化
      - Godiva Japan 与 Orchid 的股权结构、董事及法定公告更新
    alert_rules:
      红色预警:
        - 股东出售或质押客户公司股权，或控制权发生已公告变动
        - 债券或贷款违约、银行停止新增融资、重大资产被冻结或查封
        - 董事长、CEO、CFO 突发变更，重大诉讼、监管调查或评级大幅下调
      橙色预警:
        - 债务展期、重大资产出售、PE 股东启动退出或股东出现流动性压力
        - 经营出现大额亏损、核心管理人员连续调整或评级展望转负
      黄色关注:
        - 一般管理层调整、新增融资、资产证券化、战略调整或门店业务重组
    # 已核验基准事件：启动服务时按标题与来源链接去重入库，展示在近三个月公开信息事件中。
    # 修改记录：2026-08-26 | DingJiaye
    verified_events:
      - title: Godiva Japan 银团同意将约 750 亿日元贷款展期至 2027 年 3 月
        summary: 2026年6月30日，《日本时报》转载彭博报道，约25家贷款机构（包括三菱UFJ银行和三井住友银行）已同意将 Godiva Japan 约750亿日元贷款的到期日延后9个月，原定于6月底到期的债务展期至2027年3月。报道同时称，三菱UFJ银行拟提供50亿日元超级优先贷款；在展期期间，贷款行将评估经营表现、争取新增资本、推进重组方案，并考虑引入替代 MBK Partners 的新企业赞助方。报道援引知情人士，MBK 发言人确认所有贷款人已同意展期，并表示将于新的到期日前推进出售流程；Godiva、日本三菱UFJ银行及三井住友银行未就报道细节公开置评。报道还称，截至2025年12月末公司借款约750亿日元，其中约605亿日元为优先贷款、约140亿日元为夹层债务，2025年净亏损约300亿日元。
        impact_analysis: 贷款展期避免了原到期日的即时偿付压力，但并未消除约750亿日元债务在2027年3月前的再融资或处置需求。新增超级优先贷款如按报道落地，可能提高新增资金的受偿顺位，并使既有债权人的重组安排更依赖经营修复、外部注资及潜在股东退出交易的执行。贷款行拟同步评估盈利并制定重组方案，反映融资结构与盈利恢复仍是关键不确定性；应重点核验展期正式协议、利率和担保条件、新资本到位、MBK 出售流程，以及 Godiva Japan 对经营与现金流的后续正式披露。
        source_name: 《日本时报》／彭博
        source_url: https://www.japantimes.co.jp/business/2026/06/30/companies/godiva-loan-extension-agreement/
        published_at: '2026-06-30T00:00:00+09:00'
        related_company: Godiva Japan／MBK Partners／三菱UFJ银行／三井住友银行
        risk_category: 金融与经营数据
        risk_level: 高
