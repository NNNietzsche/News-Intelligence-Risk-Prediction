# 主体评估的默认监控清单与可追溯公开信源。
# source_type: official | regulatory | exchange | industry | media
# relation: direct（主体本身）| contextual（已点名的股东/上下游企业新闻，不触发主体预警）
# related_parties: 可选。母公司/股东/已知对手方；无名单时不得用行业词代替上下游。
#   role 仅允许：parent / shareholder / supplier / customer / counterparty。
# executives: 可选。高管/董事姓名，只用于人事匹配，不要写成 related_parties。
#
# briefing_sources: 最新消息直连 RSS/JSON（优先）。每个主体同一套逻辑：
#   1) 已配置的直连 feed；2) 否则用 official/media 的 query 生成 Google News RSS；
#   3) 仍没有时，用主体名称生成跨媒体检索。页面打开后后台拉取，有核心事件时用 Gemini 摘要。
# financial_source_page: 当期报告 PDF 发现页。每个主体同一套财务逻辑：
#   有 stock_code（株探）时抓通期三表；没有时从本页发现最新一期财务报表 PDF，
#   把 PDF 放进来源链接，并尽量摘录要点填入三表。
#   「查看原始整理页」有 stock_code 时指向株探，无株探时指向当期 PDF。
# financial_pdf_hint: 可选，用于在同一页多份 PDF 中锁定主体（如 yu_bk、fg_fy）
# financial_source_label / financial_unit: PDF 摘录时的数据来源说明与单位（可选）
# prefer_financial_pdf: true 时，即使配置了 stock_code，也优先使用官方财报 PDF。
# financial_sources: 当期 PDF 备用直链（一览页抓取失败时使用）。
#   statement: income（损益）| balance（负债）| cashflow（流量）
#   - statement / label / url
# financial_context_metrics: 非上市主体的可核验替代经营/财务指标。必须说明集团口径，
#   不得当作主体独立三表；每项可附官方原文链接。
#
# category: 侧栏索引分组。未填写时归入「其他」。
